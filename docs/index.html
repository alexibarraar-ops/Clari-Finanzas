<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#A8DDD3">
  <meta name="application-name" content="Clari Finanzas">
  <meta name="apple-mobile-web-app-title" content="Clari">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./clari-icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./clari-icon-192.png">
  <title>Clari Finanzas</title>
  <style>
    :root{--bg:#F7FBFA;--card:#fff;--ink:#24413C;--muted:#6C817C;--mint:#A8DDD3;--line:#DCEBE7}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
    body{overflow:hidden}
    #launcher{height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,#F4FBF9,#F9FCFB)}
    .card{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 18px 55px rgba(36,65,60,.12);text-align:center}
    .brand img{width:108px;height:108px;border-radius:28px;margin-bottom:16px}
    .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#78908A;font-weight:700;margin-bottom:8px}
    h1{font-size:31px;margin:0;letter-spacing:-.03em}
    .sub{margin:7px 0 22px;color:var(--muted);font-size:14px}
    .status{padding:14px;border-radius:16px;background:#F1F8F6;color:#607A74;font-size:13px;line-height:1.5;margin-bottom:16px}
    button{width:100%;padding:16px;border:0;border-radius:16px;font-size:16px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--mint),#94D1C5);color:var(--ink)}
    .small{font-size:11px;color:#829892;line-height:1.5;margin-top:16px}
    #appView{display:none;position:fixed;inset:0;background:var(--bg)}
    .topbar{height:56px;padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;justify-content:space-between;background:#F7FBFA;border-bottom:1px solid var(--line)}
    .title{font-weight:800;font-size:16px}
    .closeApp{width:40px;height:40px;padding:0;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:26px;line-height:1;color:var(--ink)}
    #appFrame{width:100%;height:calc(100% - 56px);border:0;background:var(--bg);display:block}
  </style>
</head>
<body>
  <section id="launcher">
    <main class="card">
      <div class="brand"><img src="./clari-icon-192.png" alt="Clari Finanzas"></div>
      <div class="eyebrow">Tus finanzas · con ritmo y claridad</div>
      <h1>Clari Finanzas</h1>
      <div class="sub">Tu espacio simple para ordenar el mes.</div>
      <div class="status">Acceso directo a tu aplicación personal de ingresos y gastos.</div>
      <button onclick="abrirClari()">ABRIR CLARI</button>
      <div class="small">Instalá esta aplicación desde el menú del navegador para entrar desde su propio ícono.</div>
    </main>
  </section>

  <section id="appView">
    <div class="topbar">
      <div class="title">Clari Finanzas</div>
      <button class="closeApp" onclick="cerrarClari()" aria-label="Cerrar">×</button>
    </div>
    <iframe id="appFrame" title="Clari Finanzas" allow="microphone"></iframe>
  </section>

<script>
  const APP='https://script.google.com/macros/s/AKfycbzUuwzw3ytKRSajB0VAoPn2L-7dr12QqswhVk6m8eBHSdKndmws9RBDMUc0j7nMViUt/exec';

  function abrirClari(extra=''){
    document.getElementById('launcher').style.display='none';
    document.getElementById('appView').style.display='block';
    document.getElementById('appFrame').src=APP+extra;
  }

  function cerrarClari(){
    document.getElementById('appFrame').src='about:blank';
    document.getElementById('appView').style.display='none';
    document.getElementById('launcher').style.display='flex';
  }

  const params=new URLSearchParams(location.search);
  const voice=params.get('voice');
  if(voice){
    abrirClari('?voice='+encodeURIComponent(voice));
    history.replaceState({},'',location.pathname);
  }

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
</script>
</body>
</html>
