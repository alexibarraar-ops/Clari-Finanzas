<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#A8DDD3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Clari">
  <link rel="icon" type="image/png" href="https://alexibarraar-ops.github.io/Clari-Finanzas/clari-icon-192.png">
  <link rel="apple-touch-icon" href="https://alexibarraar-ops.github.io/Clari-Finanzas/clari-icon-192.png">
  <style>
    :root{--mint:#A8DDD3;--mint2:#78BDB0;--mint3:#DFF3EF;--bg:#F7FBFA;--ink:#24413C;--muted:#6C817C;--card:#fff;--line:#DDEBE7}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#F4FBF9 0%,#F9FCFB 52%,#F7FBFA 100%);color:var(--ink)}
    .app{max-width:520px;margin:auto;padding:22px 18px 110px}
    .hero{position:relative;overflow:hidden;background:linear-gradient(145deg,#EAF8F5,#D8F0EB);border:1px solid #D7EBE6;border-radius:28px;padding:22px 20px 20px;margin-bottom:16px;box-shadow:0 12px 34px rgba(36,65,60,.07)}
    .hero:after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;right:-32px;top:-38px;border:16px solid rgba(120,189,176,.14);box-shadow:0 0 0 10px rgba(255,255,255,.22) inset}
    .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#66837C;font-weight:700;margin-bottom:8px}
    .brand{font-size:34px;line-height:1;font-weight:750;letter-spacing:-.035em}
    .month{font-size:14px;color:#52736B;margin-top:7px;font-weight:650}
    .quote{position:relative;z-index:1;color:#55726B;margin:18px 0 0;line-height:1.5;font-size:15px;max-width:360px}
    .music-mark{position:absolute;right:24px;bottom:16px;font-size:22px;opacity:.35}
    .bandoneon-mark{position:absolute;right:24px;top:20px;width:64px;height:64px;opacity:.14;pointer-events:none;z-index:1}
    .bandoneon-mark svg{width:100%;height:100%;display:block}
    .bandoneon-mark rect,.bandoneon-mark line,.bandoneon-mark circle{stroke:#2F6E66;fill:none;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
    .section-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:#79918B;font-weight:700;margin:28px 2px 9px}
    .footer-note{text-align:center;color:#8AA09A;font-size:11px;margin:26px 0 4px;letter-spacing:.04em}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:rgba(255,255,255,.96);border:1px solid #E4EFEC;border-radius:20px;padding:16px;box-shadow:0 8px 24px rgba(36,65,60,.06)}
    .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#78908A}.value{font-weight:750;margin-top:7px;letter-spacing:-.02em}.big{width:100%;border:0;border-radius:18px;padding:18px;font-size:17px;font-weight:750;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}.big:active{transform:scale(.985)}
    .voice{background:linear-gradient(135deg,#A8DDD3,#96D2C6);color:var(--ink);margin-top:16px;box-shadow:0 10px 24px rgba(120,189,176,.18)}.secondary{background:#fff;color:var(--ink);border:1px solid #dce8e5;margin-top:10px}
    h2{font-size:18px;margin-top:28px}.mov{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #edf2f0}.mov:last-child{border-bottom:0}
    .sub{font-size:12px;color:var(--muted);margin-top:3px}.sheet{position:fixed;inset:0;background:rgba(247,251,250,.98);display:none;align-items:flex-end;justify-content:center;z-index:1000}.sheet.show{display:flex}
    .panel{width:100%;max-width:520px;height:100dvh;max-height:100dvh;overflow:auto;background:var(--bg);border-radius:0;padding:20px;padding-top:max(20px,env(safe-area-inset-top))}.head{display:flex;justify-content:space-between;align-items:center}
    .close{border:0;background:#fff;border-radius:50%;width:38px;height:38px;font-size:22px}.seg{display:grid;grid-template-columns:1fr 1fr;background:#e9f4f1;padding:4px;border-radius:14px;margin:18px 0}
    .seg button{border:0;background:transparent;padding:11px;border-radius:10px;font-weight:700}.seg .on{background:#fff}.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px 4px}
    input,select,textarea{width:100%;padding:13px;border:1px solid #dce8e5;border-radius:14px;background:#fff;font-size:16px}.save{background:var(--mint2);color:white;margin-top:8px}
    .mic{display:block;margin:28px auto 14px;width:90px;height:90px;border:0;border-radius:50%;font-size:34px;background:var(--mint)}.voiceText{text-align:center;min-height:54px;line-height:1.4}
    .danger{background:#fff;color:#A64B4B;border:1px solid #E7CACA;margin-top:10px}.mov{cursor:pointer}.manage-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #E8F0EE;cursor:pointer}.manage-row:last-child{border-bottom:0}.manage-main{font-weight:700}.manage-meta{font-size:12px;color:var(--muted);margin-top:3px}.manage-arrow{color:#8AA09A;font-size:20px}.admin-actions{display:flex;gap:10px;margin:12px 0}.admin-actions button{flex:1}.mini-btn{border:1px solid #DCE8E5;background:#fff;border-radius:14px;padding:12px 14px;font-weight:700;color:var(--ink)}.cat-editor{display:none;margin-top:14px}.cat-editor.show{display:block}.settings-link{margin-top:10px;text-align:center}.settings-link button{border:0;background:transparent;color:#5E7B74;font-weight:700;font-size:14px;cursor:pointer}.summary-link{margin-top:14px;text-align:center}.summary-link button{border:0;background:transparent;color:var(--ink);font-weight:700;font-size:15px;cursor:pointer}.bars{display:grid;gap:12px}.bar-row{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center}.bar-name{font-size:13px}.bar-track{height:10px;background:#E7F1EF;border-radius:99px;overflow:hidden}.bar-fill{height:100%;background:var(--mint2);border-radius:99px}.bar-value{font-size:12px;font-weight:700}.summary-section{margin-top:18px}.summary-section h3{font-size:15px;margin:0 0 10px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pill-card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 8px 24px rgba(36,65,60,.06)}.notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 15px;border-radius:13px;display:none}.notice.show{display:block}
  </style>
</head>
<body>
<div class="app" id="app">Cargando Clari…</div>

<div class="sheet" id="formSheet"><div class="panel">
  <div class="head"><h2 id="formTitle">Nuevo movimiento</h2><button class="close" onclick="closeSheet('formSheet')">×</button></div>
  <div class="seg"><button id="gBtn" class="on" onclick="setTipo('GASTO')">Gasto</button><button id="iBtn" onclick="setTipo('INGRESO')">Ingreso</button></div>
  <div class="field"><label>Monto</label><input id="monto" inputmode="decimal" placeholder="$ 0"></div>
  <div class="field"><label>Concepto</label><input id="concepto" placeholder="Ej. supermercado"></div>
  <div class="field"><label>Categoría</label><select id="categoria"></select></div>
  <div class="field"><label>Cuenta</label><select id="cuenta" onchange="fillInstrumentos()"></select></div>
  <div class="field" id="instWrap"><label>Instrumento</label><select id="instrumento"></select></div>
  <div class="field" id="tipoWrap"><label>Tipo de gasto</label><select id="tipoGasto"><option>VARIABLE</option><option>FIJO</option></select></div>
  <div class="field" id="benWrap"><label>¿Para quién?</label><select id="beneficiario"></select></div>
  <div class="field"><label>Fecha</label><input type="date" id="fecha"></div>
  <div class="field"><label>Nota</label><textarea id="nota"></textarea></div>
  <button class="big save" id="saveBtn" onclick="guardar(event)">Guardar movimiento</button>
  <button class="big danger" id="deleteBtn" style="display:none" onclick="eliminarActual()">Eliminar movimiento</button>
</div></div>

<div class="sheet" id="voiceSheet"><div class="panel">
  <div class="head"><h2>Decir un movimiento</h2><button class="close" onclick="closeSheet('voiceSheet')">×</button></div>
  <button class="mic" id="mic" onclick="toggleVoice()">🎙️</button>
  <div class="voiceText" id="voiceText">Tocá el micrófono y contame qué movimiento hiciste.</div>
  <button class="big secondary" onclick="pasarVoz()">Revisar datos</button>
</div></div>

<div class="sheet" id="summarySheet"><div class="panel">
  <div class="head"><h2>Resumen del mes</h2><button class="close" onclick="closeSheet('summarySheet')">×</button></div>
  <div id="summaryContent"></div>
</div></div>

<div class="sheet" id="transferSheet"><div class="panel">
  <div class="head"><h2 id="transferTitle">Transferir entre cuentas</h2><button class="close" onclick="closeSheet('transferSheet')">×</button></div>
  <div class="field"><label>Monto</label><input id="transferMonto" inputmode="decimal" placeholder="$ 0"></div>
  <div class="field"><label>Desde</label><select id="transferOrigen" onchange="fillTransferDestinos()"></select></div>
  <div class="field"><label>Hacia</label><select id="transferDestino"></select></div>
  <div class="field"><label>Fecha</label><input type="date" id="transferFecha"></div>
  <div class="field"><label>Nota</label><textarea id="transferNota" placeholder="Opcional"></textarea></div>
  <button class="big save" id="transferSaveBtn" onclick="guardarTransferenciaUI(event)">Guardar transferencia</button>
  <button class="big danger" id="transferDeleteBtn" style="display:none" onclick="eliminarTransferenciaUI()">Eliminar transferencia</button>
</div></div>

<div class="sheet" id="categoriesSheet"><div class="panel">
  <div class="head"><h2>Categorías</h2><button class="close" onclick="closeSheet('categoriesSheet')">×</button></div>
  <div class="admin-actions">
    <button class="mini-btn" onclick="nuevaCategoria()">+ Nueva categoría</button>
  </div>
  <div id="categoriesList" class="card"></div>

  <div id="catEditor" class="cat-editor">
    <div class="section-kicker" id="catEditorTitle">Nueva categoría</div>
    <div class="field"><label>Nombre</label><input id="catNombre" placeholder="Ej. Mascotas"></div>
    <div class="field"><label>Tipo</label><select id="catTipo" onchange="toggleCatFijo()"><option value="GASTO">Gasto</option><option value="INGRESO">Ingreso</option></select></div>
    <div class="field" id="catFijoWrap"><label>Tipo de gasto por defecto</label><select id="catFijo"><option value="VARIABLE">Variable</option><option value="FIJO">Fijo</option></select></div>
    <button class="big save" id="catSaveBtn" onclick="guardarCategoriaUI(event)">Guardar categoría</button>
    <button class="big danger" id="catDeleteBtn" style="display:none" onclick="eliminarCategoriaUI()">Eliminar categoría</button>
  </div>
</div></div>

<div class="notice" id="notice"></div>
<script>
let DATA=null,tipo='GASTO',voiceRaw='',rec=null,listening=false,editingId=null,fraseDelDia='',editingCategoriaId=null,editingTransferId=null;
google.script.run.withSuccessHandler(init).withFailureHandler(err=>toast(err.message||err)).getBootstrapData();

function init(d){DATA=d;fraseDelDia=normalizarFrase(d.frase||'Hoy también cuenta.');render();hydrate();handleVoiceReturn()}
function render(){
 const r=DATA.resumen||{ingresos:0,gastos:0,disponible:0};
 const mes=nombreMesActual();
 app.innerHTML=
 '<div class="hero">'+
   '<div class="eyebrow">Lado A · Tus finanzas</div>'+
   '<div class="brand">Clari</div>'+
   '<div class="month">'+esc(mes)+'</div>'+
   '<div class="quote" id="fraseDia">“'+esc(fraseDelDia)+'”</div>'+
   '<div class="bandoneon-mark" aria-hidden="true"><svg viewBox="0 0 100 100"><rect x="8" y="28" width="24" height="44" rx="5"></rect><rect x="68" y="28" width="24" height="44" rx="5"></rect><line x1="32" y1="32" x2="68" y2="32"></line><line x1="32" y1="40" x2="68" y2="40"></line><line x1="32" y1="48" x2="68" y2="48"></line><line x1="32" y1="56" x2="68" y2="56"></line><line x1="32" y1="64" x2="68" y2="64"></line><line x1="32" y1="72" x2="68" y2="72"></line><circle cx="17" cy="40" r="2.6"></circle><circle cx="17" cy="52" r="2.6"></circle><circle cx="17" cy="64" r="2.6"></circle><circle cx="83" cy="40" r="2.6"></circle><circle cx="83" cy="52" r="2.6"></circle><circle cx="83" cy="64" r="2.6"></circle></svg></div>'+
   '<div class="music-mark">♪</div>'+
 '</div>'+
 '<div class="summary">'+mini('Ingresos',r.ingresos)+mini('Gastos',r.gastos)+mini('Disponible',r.disponible)+'</div>'+
 '<button class="big voice" onclick="openVoiceExternal()">🎙️ Decir un movimiento</button>'+
 '<button class="big secondary" onclick="openManual()">+ Cargar manualmente</button>'+
 '<button class="big secondary" onclick="openTransferencia()">↔ Transferir entre cuentas</button>'+
 '<div class="summary-link"><button onclick="openResumen()">Ver resumen del mes →</button></div>'+
 '<div class="settings-link"><button onclick="openCategorias()">⚙️ Administrar categorías</button></div>'+
 '<div class="section-kicker">Últimos movimientos</div><div class="card">'+movs(DATA.ultimos||[])+'</div>'+
 '<div class="footer-note">hecho para Clari · con ritmo y claridad</div>';
}

function openResumen(){
  google.script.run
    .withSuccessHandler(r=>{
      DATA.resumenDetallado=r;
      renderResumen();
      openSheet('summarySheet');
    })
    .withFailureHandler(x=>toast(x.message||x))
    .getResumenDetallado();
}

function renderResumen(){
  const r=DATA.resumenDetallado||{
    ingresos:0,gastos:0,disponible:0,categorias:[],beneficiarios:[],
    tipoGasto:{FIJO:0,VARIABLE:0},gastosMesAnterior:0,variacionVsAnterior:null
  };

  const maxCat=Math.max(1,...(r.categorias||[]).map(x=>Number(x.monto||0)));
  const cats=(r.categorias||[]).length
    ? '<div class="bars">'+r.categorias.slice(0,6).map(x=>barRow(x.nombre,x.monto,maxCat)).join('')+'</div>'
    : '<div class="sub">Todavía no hay gastos este mes.</div>';

  const fijo=Number((r.tipoGasto||{}).FIJO||0);
  const variable=Number((r.tipoGasto||{}).VARIABLE||0);
  const ben=(r.beneficiarios||[]);

  let comp='Sin datos del mes anterior.';
  if(r.gastosMesAnterior>0 && r.variacionVsAnterior!==null){
    const v=Number(r.variacionVsAnterior);
    comp=(v>=0?'Gastaste ':'Gastaste ')+Math.abs(v).toFixed(0)+'% '+(v>=0?'más':'menos')+' que el mes anterior.';
  }

  summaryContent.innerHTML=
    '<div class="summary">'+
      mini('Ingresos',r.ingresos)+mini('Gastos',r.gastos)+mini('Disponible',r.disponible)+
    '</div>'+
    '<div class="summary-section"><h3>¿En qué gastaste?</h3>'+cats+'</div>'+
    '<div class="summary-section"><h3>Fijos vs variables</h3><div class="split">'+
      '<div class="pill-card"><div class="label">Fijos</div><div class="value">'+money(fijo)+'</div></div>'+
      '<div class="pill-card"><div class="label">Variables</div><div class="value">'+money(variable)+'</div></div>'+
    '</div></div>'+
    '<div class="summary-section"><h3>¿Para quién?</h3><div class="split">'+
      '<div class="pill-card"><div class="label">'+esc((ben[0]&&ben[0].nombre)||'Clari')+'</div><div class="value">'+money((ben[0]&&ben[0].monto)||0)+'</div></div>'+
      '<div class="pill-card"><div class="label">'+esc((ben[1]&&ben[1].nombre)||'Hija')+'</div><div class="value">'+money((ben[1]&&ben[1].monto)||0)+'</div></div>'+
    '</div></div>'+
    '<div class="summary-section"><h3>Comparación</h3><div class="pill-card"><div class="sub">'+esc(comp)+'</div></div></div>';
}

function barRow(nombre,monto,max){
  const pct=Math.max(4,Math.round((Number(monto||0)/max)*100));
  return '<div class="bar-row"><div class="bar-name">'+esc(nombre)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div><div class="bar-value">'+money(monto)+'</div></div>';
}

function mini(l,v){return '<div class="card"><div class="label">'+l+'</div><div class="value">'+money(v)+'</div></div>'}
function movs(a){
  if(!a.length)return '<div class="sub">Todavía no hay movimientos.</div>';
  return a.map(m=>{
    if(String(m.tipo||'').toUpperCase()==='TRANSFERENCIA'){
      return '<div class="mov" onclick="editarTransferenciaUI(\''+esc(m.id)+'\')"><div><b>Transferencia</b><div class="sub">'+esc(m.cuenta||'')+' → '+esc(m.cuentaDestino||'')+'</div></div><b>↔ '+money(m.monto)+'</b></div>';
    }
    return '<div class="mov" onclick="editarMovimiento(\''+esc(m.id)+'\')"><div><b>'+esc(m.concepto||m.categoria)+'</b><div class="sub">'+esc(m.categoria||'')+' · '+esc(m.cuenta||'')+(m.instrumento?' · '+esc(m.instrumento):'')+'</div></div><b>'+(m.tipo==='INGRESO'?'+':'-')+money(m.monto)+'</b></div>';
  }).join('');
}
function hydrate(){fecha.value=today();cuenta.innerHTML=DATA.cuentas.map(x=>'<option>'+esc(x.NOMBRE)+'</option>').join('');beneficiario.innerHTML=DATA.beneficiarios.map(x=>'<option>'+esc(x.NOMBRE)+'</option>').join('');transferOrigen.innerHTML=DATA.cuentas.map(x=>'<option>'+esc(x.NOMBRE)+'</option>').join('');transferFecha.value=today();fillTransferDestinos();fillInstrumentos();fillCategorias()}
function setTipo(t){tipo=t;gBtn.classList.toggle('on',t==='GASTO');iBtn.classList.toggle('on',t==='INGRESO');tipoWrap.style.display=t==='GASTO'?'block':'none';benWrap.style.display=t==='GASTO'?'block':'none';fillCategorias()}
function fillCategorias(){let list=DATA.categorias.filter(x=>x.TIPO===tipo);categoria.innerHTML=list.map(x=>'<option>'+esc(x.NOMBRE)+'</option>').join('');categoria.onchange=()=>{let c=list.find(x=>x.NOMBRE===categoria.value);if(c&&c.FIJO_VARIABLE_DEFAULT&&tipo==='GASTO')tipoGasto.value=c.FIJO_VARIABLE_DEFAULT};if(list.length)categoria.onchange()}
function fillInstrumentos(){let list=DATA.instrumentos.filter(x=>x.CUENTA===cuenta.value);instWrap.style.display=list.length?'block':'none';instrumento.innerHTML=list.map(x=>'<option data-medio="'+esc(x.MEDIO_PAGO)+'">'+esc(x.INSTRUMENTO)+'</option>').join('')}
function openManual(){editingId=null;voiceRaw='';formTitle.textContent='Nuevo movimiento';saveBtn.textContent='Guardar movimiento';deleteBtn.style.display='none';monto.value='';concepto.value='';nota.value='';fecha.value=today();setTipo('GASTO');openSheet('formSheet')}
function guardar(e){
  let o=instrumento.options[instrumento.selectedIndex];
  let p={
    id:editingId||'',
    tipo,
    monto:parseMoney(monto.value),
    concepto:concepto.value.trim(),
    categoria:categoria.value,
    cuenta:cuenta.value,
    medioPago:o?o.dataset.medio:cuenta.value,
    instrumento:instrumento.value||'',
    tipoGasto:tipo==='GASTO'?tipoGasto.value:'',
    beneficiario:tipo==='GASTO'?beneficiario.value:'Clari',
    fecha:fecha.value,
    nota:nota.value.trim(),
    origen:voiceRaw?'VOZ':'MANUAL',
    textoOriginal:voiceRaw
  };

  if(!p.monto) return toast('Ingresá un monto válido.');
  if(!p.concepto) return toast('Ingresá un concepto.');

  const btn=e.currentTarget;
  btn.disabled=true;
  btn.textContent=editingId?'Guardando cambios…':'Guardando…';

  const runner=google.script.run
    .withSuccessHandler(r=>{
      DATA.resumen=r.resumen;
      DATA.ultimos=r.ultimos;
      closeSheet('formSheet');
      editingId=null;
      voiceRaw='';
      render();
      btn.disabled=false;
      btn.textContent='Guardar movimiento';
      toast('Movimiento guardado.');
    })
    .withFailureHandler(x=>{
      btn.disabled=false;
      btn.textContent=editingId?'Guardar cambios':'Guardar movimiento';
      toast(x.message||x);
    });

  if(editingId) runner.actualizarMovimiento(p);
  else runner.guardarMovimiento(p);
}

function editarMovimiento(id){
  const m=(DATA.ultimos||[]).find(x=>x.id===id);
  if(!m) return toast('No encontré ese movimiento.');

  editingId=id;
  voiceRaw='';
  formTitle.textContent='Editar movimiento';
  saveBtn.textContent='Guardar cambios';
  deleteBtn.style.display='block';

  setTipo(String(m.tipo||'GASTO').toUpperCase());
  monto.value=m.monto||'';
  concepto.value=m.concepto||'';

  if(m.categoria) categoria.value=m.categoria;
  if(typeof categoria.onchange==='function') categoria.onchange();

  if(m.cuenta){
    cuenta.value=m.cuenta;
    fillInstrumentos();
  }

  if(m.instrumento) instrumento.value=m.instrumento;
  if(m.tipoGasto) tipoGasto.value=m.tipoGasto;
  if(m.beneficiario) beneficiario.value=m.beneficiario;
  nota.value=m.nota||'';
  fecha.value=fechaIsoDesdeDisplay(m.fecha);

  openSheet('formSheet');
}

function eliminarActual(){
  if(!editingId) return;
  if(!confirm('¿Eliminar este movimiento?')) return;

  deleteBtn.disabled=true;
  deleteBtn.textContent='Eliminando…';

  google.script.run
    .withSuccessHandler(r=>{
      DATA.resumen=r.resumen;
      DATA.ultimos=r.ultimos;
      closeSheet('formSheet');
      editingId=null;
      render();
      deleteBtn.disabled=false;
      deleteBtn.textContent='Eliminar movimiento';
      toast('Movimiento eliminado.');
    })
    .withFailureHandler(x=>{
      deleteBtn.disabled=false;
      deleteBtn.textContent='Eliminar movimiento';
      toast(x.message||x);
    })
    .eliminarMovimiento(editingId);
}

function fechaIsoDesdeDisplay(v){
  const m=String(v||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return today();
  return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
}

function openVoiceExternal(){
  if(!DATA || !DATA.appUrl) return toast('Todavía no tengo la dirección de regreso de la app.');
  const voiceUrl='https://alexibarraar-ops.github.io/Clari-Finanzas/voice.html?return='+encodeURIComponent(DATA.appUrl);
  window.top.location.href=voiceUrl;
}
function handleVoiceReturn(){
  google.script.url.getLocation(function(location){
    const text=(location && location.parameter && location.parameter.voice) ? location.parameter.voice : '';
    if(!text) return;

    const key='clari_voice_consumed';
    const fingerprint=text+'|'+((location && location.parameters && location.parameters.voice_ts && location.parameters.voice_ts[0]) || '');

    if(sessionStorage.getItem(key)===fingerprint) return;

    sessionStorage.setItem(key,fingerprint);
    voiceRaw=text;
    pasarVoz();
  });
}
function setupVoice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;rec=new SR();rec.lang='es-AR';rec.continuous=false;rec.interimResults=false;rec.onstart=()=>{listening=true;mic.textContent='⏹️';voiceText.textContent='Te escucho…'};rec.onresult=e=>{voiceRaw=e.results[0][0].transcript;voiceText.textContent=voiceRaw};rec.onend=()=>{listening=false;mic.textContent='🎙️'}}
function toggleVoice(){if(!rec)return toast('Este navegador no permite voz directa.');listening?rec.stop():rec.start()}
function pasarVoz(){
  if(!voiceRaw) return toast('Primero grabá un movimiento.');

  const t=norm(voiceRaw);
  const ingreso=/(cobre|cobro|sueldo|depositaron|alquiler cobrado|me pagaron|me transfirieron)/.test(t);
  setTipo(ingreso?'INGRESO':'GASTO');

  monto.value=detectarMontoVoz(voiceRaw);
  fecha.value=detectarFechaVoz(t);

  const cuentaDetectada=detectarCuenta(t);
  if(cuentaDetectada){
    cuenta.value=cuentaDetectada;
    fillInstrumentos();
  }

  if(/credito/.test(t)) instrumento.value='Crédito';
  else if(/debito/.test(t)) instrumento.value='Débito';

  const cat=detectarCategoria(t, ingreso?'INGRESO':'GASTO');
  if(cat){
    categoria.value=cat.NOMBRE;
    if(typeof categoria.onchange==='function') categoria.onchange();
  }

  concepto.value=detectarConcepto(t,cat,cuentaDetectada);

  closeSheet('voiceSheet');
  openSheet('formSheet');
}

function detectarMontoVoz(texto){
  const t=norm(texto);

  // 38 mil 500
  let m=t.match(/(\d+)\s*mil\s*(\d{1,3})\b/);
  if(m){
    return Number(m[1])*1000+Number(m[2]);
  }

  // 38 mil / 2.5 mil / 2,5 mil
  m=t.match(/(\d+(?:[.,]\d+)?)\s*mil\b/);
  if(m){
    return Math.round(Number(m[1].replace(',','.'))*1000);
  }

  // Reconocimiento de voz puede devolver 38.000, 38,000 o 38 000.
  m=texto.match(/(\d{1,3}(?:[.,\s]\d{3})+|\d+)/);
  if(!m) return '';

  let s=String(m[0]).trim();

  // Si los separadores están agrupando miles, eliminarlos.
  if(/^\d{1,3}(?:[.,\s]\d{3})+$/.test(s)){
    return Number(s.replace(/[.,\s]/g,'')) || '';
  }

  return parseMoney(s);
}

function detectarFechaVoz(t){
  const d=new Date();
  if(/\bayer\b/.test(t)) d.setDate(d.getDate()-1);
  else if(/\banteayer\b/.test(t)) d.setDate(d.getDate()-2);

  const z=new Date(d-d.getTimezoneOffset()*60000);
  return z.toISOString().slice(0,10);
}

function detectarCuenta(t){
  for(const a of DATA.cuentas||[]){
    if(t.includes(norm(a.NOMBRE))) return a.NOMBRE;
  }
  if(/mercado pago/.test(t)) return 'Mercado Pago';
  if(/personal pay/.test(t)) return 'Personal Pay';
  if(/banco galicia|galicia/.test(t)) return 'Banco Galicia';
  if(/banco ciudad|ciudad/.test(t)) return 'Banco Ciudad';
  if(/efectivo/.test(t)) return 'Efectivo';
  return '';
}

function detectarCategoria(t,tipoMov){
  const cats=(DATA.categorias||[]).filter(c=>String(c.TIPO).toUpperCase()===tipoMov);

  const exact=cats.find(c=>t.includes(norm(c.NOMBRE)));
  if(exact) return exact;

  const reglas=[
    [/(supermercado|coto|carrefour|comida|almuerzo|cena|verduleria|carniceria|panaderia)/,'Comida'],
    [/(delivery|rappi|pedidos ya)/,'Delivery'],
    [/(cafe|cafeteria)/,'Café'],
    [/(ropa|remera|pantalon|zapatilla|campera|vestido)/,'Ropa'],
    [/(uber|cabify|taxi|subte|colectivo|tren|sube)/,'Transporte'],
    [/(luz|edenor|edesur)/,'Luz'],
    [/(gas|metrogas)/,'Gas'],
    [/(agua|aysa)/,'Agua'],
    [/(internet|fibertel|personal flow|telecentro)/,'Internet'],
    [/(celular|telefono|movistar|claro)/,'Celular'],
    [/(seguro)/,'Seguro'],
    [/(prepaga|obra social|medico|farmacia)/,'Prepaga / obra social'],
    [/(salida|cine|teatro|bar|restaurant|restaurante)/,'Salidas'],
    [/(sueldo|maestra|jardin)/,'Sueldo - maestra jardinera'],
    [/(alquiler cobrado|inquilino|cobre el alquiler|cobro de alquiler)/,'Alquiler cobrado']
  ];

  for(const [rx,nombre] of reglas){
    if(rx.test(t)){
      const found=cats.find(c=>norm(c.NOMBRE)===norm(nombre));
      if(found) return found;
    }
  }

  return cats.find(c=>/otros/i.test(c.NOMBRE)) || cats[0] || null;
}

function detectarConcepto(t,cat,cuentaDetectada){
  let s=t;

  s=s.replace(/\b(hoy|ayer|anteayer)\b/g,' ');
  s=s.replace(/\b(gaste|gasto|pague|pago|compre|cobre|cobro|me depositaron|me pagaron|me transfirieron)\b/g,' ');
  s=s.replace(/\b(pesos?)\b/g,' ');
  s=s.replace(/\$?\s*\d{1,3}(?:[.\s]\d{3})*(?:[,.]\d+)?/g,' ');
  s=s.replace(/\b(con|por|en|de|del|la|el|una|un|y)\b/g,' ');

  const tokens=[
    cuentaDetectada,
    'mercado pago',
    'personal pay',
    'banco galicia',
    'banco ciudad',
    'credito','debito','tarjeta','saldo','app',
    cat&&cat.NOMBRE
  ].filter(Boolean);

  tokens.forEach(x=>{
    const nx=norm(x);
    s=s.split(nx).join(' ');
  });

  s=s.replace(/\s+/g,' ').trim();

  if(!s && cat) return cat.NOMBRE;

  // Si sólo quedó un fragmento del medio de pago, preferimos la categoría.
  if(cat && /^(mercado|galicia|ciudad|personal|pago)$/.test(s)) return cat.NOMBRE;

  return s ? s.charAt(0).toUpperCase()+s.slice(1) : (cat ? cat.NOMBRE : 'Movimiento');
}



function openTransferencia(){
  editingTransferId=null;
  transferTitle.textContent='Transferir entre cuentas';
  transferMonto.value='';
  transferNota.value='';
  transferFecha.value=today();
  transferOrigen.innerHTML=DATA.cuentas.map(x=>'<option>'+esc(x.NOMBRE)+'</option>').join('');
  fillTransferDestinos();
  transferDeleteBtn.style.display='none';
  transferSaveBtn.textContent='Guardar transferencia';
  openSheet('transferSheet');
}

function fillTransferDestinos(){
  const origen=transferOrigen.value;
  const list=(DATA.cuentas||[]).filter(x=>x.NOMBRE!==origen);
  const actual=transferDestino.value;
  transferDestino.innerHTML=list.map(x=>'<option>'+esc(x.NOMBRE)+'</option>').join('');
  if(list.some(x=>x.NOMBRE===actual)) transferDestino.value=actual;
}

function guardarTransferenciaUI(e){
  const p={
    id:editingTransferId||'',
    monto:parseMoney(transferMonto.value),
    cuentaOrigen:transferOrigen.value,
    cuentaDestino:transferDestino.value,
    fecha:transferFecha.value,
    nota:transferNota.value.trim(),
    origen:'MANUAL',
    textoOriginal:''
  };

  if(!p.monto) return toast('Ingresá un monto válido.');
  if(!p.cuentaOrigen || !p.cuentaDestino) return toast('Elegí las dos cuentas.');
  if(p.cuentaOrigen===p.cuentaDestino) return toast('Las cuentas deben ser distintas.');

  const btn=e.currentTarget;
  btn.disabled=true;
  btn.textContent=editingTransferId?'Guardando cambios…':'Guardando…';

  google.script.run
    .withSuccessHandler(r=>{
      DATA.resumen=r.resumen;
      DATA.ultimos=r.ultimos;
      closeSheet('transferSheet');
      editingTransferId=null;
      render();
      btn.disabled=false;
      btn.textContent='Guardar transferencia';
      toast('Transferencia guardada.');
    })
    .withFailureHandler(x=>{
      btn.disabled=false;
      btn.textContent=editingTransferId?'Guardar cambios':'Guardar transferencia';
      toast(x.message||x);
    })
    .guardarTransferencia(p);
}

function editarTransferenciaUI(id){
  const m=(DATA.ultimos||[]).find(x=>x.id===id);
  if(!m) return toast('No encontré esa transferencia.');

function eliminarTransferenciaUI(){

function normalizarFrase(v){return String(v||'').replace(/\s+/g,' ').trim()||'Hoy también cuenta.'}
function openSheet(id){document.getElementById(id).classList.add('show')}
function closeSheet(id){document.getElementById(id).classList.remove('show')}
function nombreMesActual(){
  const s=new Intl.DateTimeFormat('es-AR',{month:'long',year:'numeric'}).format(new Date());
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function money(v){return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(v||0))}
function parseMoney(v){let s=String(v||'').replace(/[^\d,.-]/g,'');if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return Number(s.replace(',','.'))||0}
function today(){let d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(m){notice.textContent=m;notice.classList.add('show');setTimeout(()=>notice.classList.remove('show'),2500)}
